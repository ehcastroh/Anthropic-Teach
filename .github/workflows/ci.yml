name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CLAUDE_CODE_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: IRL example tests (offline)
        run: uv run pytest
      - name: Lessons and solutions (dry-run)
        shell: bash
        run: |
          for nb in lessons/*.ipynb homework/solutions/*.ipynb homework/01*.ipynb homework/02*.ipynb; do
            echo "== $nb"
            uv run jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nbcheck" "$nb"
          done
